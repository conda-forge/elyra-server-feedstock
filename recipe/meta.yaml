{% set name = "elyra-server" %}
{% set version = "4.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/elyra_server-{{ version }}.tar.gz
  sha256: 058e23dcb05beb33af64f6237a6e48259d82d2b6a71a98f0e3d13c5fa7f9f865

build:
  noarch: python
  entry_points:
    - elyra-metadata = elyra.metadata.metadata_app:MetadataApp.main
    - elyra-pipeline = elyra.cli.pipeline_app:pipeline
    - jupyter-elyra = elyra.elyra_app:launch_instance
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    # Upstream also requires kfp, kfp-kubernetes and jupyterlab-magic-wand, but
    # conda-forge cannot satisfy them yet, so they are left out (see test below).
    - python >={{ python_min }}
    - autopep8 >=1.5.0
    - black >=26.1,<27
    - click >=8.2
    - colorama
    - deprecation
    - entrypoints >=0.3
    - jinja2 >=3
    - jsonschema >=3.2.0
    - jupyter-ai >=2.0.0,<3.0.0
    - jupyter_client >=7.4.9
    - jupyter_core >=5.3.1
    - jupyter_events >=0.7.0
    - jupyter-packaging >=0.12.3
    - jupyter-resource-usage >=1.3.0,<1.4
    - jupyter_server >=2.7.3
    - jupyterlab-git >=0.55.0,<0.56
    - jupyterlab-lsp >=5.3.0,<5.4
    - jupyterlab >=4.6.0,<5
    - markupsafe >=2.1
    - minio >=7.0.0,!=7.2.1
    - nbclient >=0.10.0
    - nbconvert >=6.5.1
    - nbdime >=4.0.1,<4.1
    - nbformat >=5.1.2
    - networkx >=2.5.1
    - papermill >=2.3.4
    - pygithub
    - python-lsp-server >=1.11.0
    - pyyaml >=5.3.1
    - requests >=2.31
    - rfc3986-validator >=0.1.1
    - tornado >=6.1.0
    - traitlets >=4.3.2
    - typing-extensions >=3.10
    - urllib3 >=2.5.0
    - watchdog >=2.1.3
    - websocket-client
    - yaspin

test:
  imports:
    - elyra
  commands:
    # pip check must pass except for upstream requirements that conda-forge
    # cannot satisfy yet, which are therefore left out of run:
    #   - jupyterlab-magic-wand, kfp-kubernetes: not packaged on conda-forge
    #   - kfp: every conda-forge kfp 2.x pins urllib3 <2; elyra needs urllib3 >=2.5
    #   - faiss-cpu (from jupyter-ai 2.x): conda-forge's faiss-cpu lacks PyPI metadata
    - pip check 2>&1 | grep -vE "requires (jupyterlab-magic-wand|kfp|kfp-kubernetes|faiss-cpu), which is not installed" | grep -E "which is not installed|has requirement" && exit 1 || true
    - elyra-metadata --help || test $? -eq 1
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/elyra-server/
  summary: "The elyra-server package provides common core libraries and functions that are required by Elyra's individual extensions. Note: Installing this package alone will not enable the use of Elyra. Please install the 'elyra' package instead. e.g. pip install elyra[all]"
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - akchinSTC
    - lresende
